version: '3.8'

services:
  # 1. PostGIS + Vector Database
  db:
    image: postgis/postgis:16-3.4
    container_name: vision-postgis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vision_land_governance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vision-network

  # 2. Java Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision-spring-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vision_land_governance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - vision-network

  # 3. Python AI RAG & Vector Intelligence Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vision-ai-rag-service
    restart: unless-stopped
    environment:
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vision_land_governance}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      - db
    networks:
      - vision-network

  # 4. React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vision-frontend-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
